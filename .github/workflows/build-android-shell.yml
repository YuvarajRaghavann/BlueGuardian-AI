name: Build BlueGuardian Android Shell
# Builds and tests on main and on Android feature branches; the APK is attached to each run.

on:
  push:
    branches:
      - main
      - 'android/phase2-cloud-build-*'
      - 'android/phase4-classic-discovery-*'
      - 'android/phase5-combined-scanning-*'
      - 'android/phase6-backend-integration-*'
      - 'android/phase6-final-ux-*'
      - 'android/phase7-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueguardian-android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Backend tests and TypeScript verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the project branch
        uses: actions/checkout@v5

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run backend regression tests and TypeScript build
        working-directory: backend
        run: npm run test:ci

  verify-btguard:
    name: BTGuard trust-engine tests and app-model export check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the project branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run BTGuard tests
        working-directory: btguard
        run: |
          pip install numpy
          python -m unittest tests.test_btguard -v

  build-debug-apk:
    name: Build debug APK in GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out the project branch
        uses: actions/checkout@v5

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Refresh npm lockfile for native bridge dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install the refreshed web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Capacitor 8 packages for this cloud build
        run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@8.4.0 @capacitor/cli@8.4.0 @capacitor/android@8.4.0

      - name: Build the existing React/Vite UI
        env:
          VITE_API_BASE: https://blueguardian-backend-phase6.onrender.com/api
        run: npm run build

      - name: Run existing frontend regression tests
        run: npm test -- --reporter=dot

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Copy web assets into the Android shell
        run: npx cap sync android

      - name: Configure API 36 and record build details
        run: node scripts/prepare-capacitor-ci.mjs

      - name: Compile debug APK without Android Studio
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: blueguardian-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-build-info.txt
          if-no-files-found: error
          retention-days: 14

      # Release APK: non-debuggable, signed with YOUR key. Runs only when the
      # repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are set.
      - name: Build signed release APK
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out app/build/outputs/apk/release/blueguardian-release.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/blueguardian-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed release APK
        if: ${{ hashFiles('android/app/build/outputs/apk/release/blueguardian-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: blueguardian-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/blueguardian-release.apk
          retention-days: 30

# Verification rerun requested after final UX changes.
