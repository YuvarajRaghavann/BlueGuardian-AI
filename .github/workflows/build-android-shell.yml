name: Build BlueGuardian Android Shell

on:
  push:
    branches:
      - 'android/phase2-cloud-build-*'
      - 'android/phase4-classic-discovery-*'
      - 'android/phase5-combined-scanning-*'
      - 'android/phase6-backend-integration-*'
      - 'android/phase6-final-ux-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueguardian-android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Backend tests and TypeScript verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the project branch
        uses: actions/checkout@v5

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run backend regression tests and TypeScript build
        working-directory: backend
        run: npm run test:ci

  build-debug-apk:
    name: Build debug APK in GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the project branch
        uses: actions/checkout@v5

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Refresh npm lockfile for native bridge dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install the refreshed web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Capacitor 8 packages for this cloud build
        run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@8.4.0 @capacitor/cli@8.4.0 @capacitor/android@8.4.0

      - name: Build the existing React/Vite UI
        run: npm run build

      - name: Run existing frontend regression tests
        run: npm test -- --reporter=dot

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Copy web assets into the Android shell
        run: npx cap sync android

      - name: Configure API 36 and record build details
        run: node scripts/prepare-capacitor-ci.mjs

      - name: Compile debug APK without Android Studio
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: blueguardian-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-build-info.txt
          if-no-files-found: error
          retention-days: 14
