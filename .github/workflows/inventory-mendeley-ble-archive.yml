name: Inventory Actual BLE Capture Archive

on:
  push:
    branches:
      - 'ml/blueguardian-trained-threat-model-20261016'
    paths:
      - 'ml_training/inspect_mendeley_archive.py'
      - '.github/workflows/inventory-mendeley-ble-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueguardian-mendeley-archive-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Fetch CC BY BLE archive and inventory labels/files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated ML branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download archive to a temporary runner directory and inspect
        run: python ml_training/inspect_mendeley_archive.py

      - name: Upload archive inventory only, never raw packet captures
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-ble-archive-inventory
          path: ml_training/reports/mendeley_archive_inventory.json
          if-no-files-found: error
          retention-days: 14
