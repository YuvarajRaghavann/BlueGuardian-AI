name: Train BLE Flood Model on Published Captures

on:
  push:
    branches:
      - 'ml/blueguardian-trained-threat-model-20261016'
    paths:
      - 'ml_training/run_public_ble_training.py'
      - 'ml_training/extract_pcap_windows.py'
      - 'ml_training/train_ble_flood_model.py'
      - 'ml_training/requirements.txt'
      - '.github/workflows/train-ble-flood-model.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blueguardian-ble-real-data-training
  cancel-in-progress: false

jobs:
  train:
    name: Train and evaluate on real published BLE captures
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out isolated ML branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml_training/requirements.txt

      - name: Install tshark for Nordic nRF Sniffer captures
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Install training dependencies
        run: python -m pip install -r ml_training/requirements.txt

      - name: Run real-data feature extraction, training and grouped holdout evaluation
        run: python -u ml_training/run_public_ble_training.py

      - name: Check evaluation gates for embedding the candidate
        id: candidate-gate
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("ml_training/reports/ble_flood_evaluation.json").read_text())
          model = json.loads(Path("src/ml/generated/bleFloodModel.json").read_text())
          eligible = (
              report.get("preliminary_gates_passed") is True
              and model.get("status") == "candidate"
              and model.get("deploymentStatus") == "disabled_until_explicit_review"
              and model.get("evaluationSummary", {}).get("preliminaryGatesPassed") is True
          )
          print(json.dumps({
              "eligible_for_embedding": eligible,
              "accuracy": report.get("metrics", {}).get("accuracy"),
              "ble_flood_recall": report.get("metrics", {}).get("ble_flood_recall"),
              "benign_false_positive_rate": report.get("metrics", {}).get("benign_false_positive_rate"),
              "candidate_remains_disabled": model.get("deploymentStatus") == "disabled_until_explicit_review",
          }, indent=2))
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"eligible={'true' if eligible else 'false'}\n")
          PY

      - name: Embed gate-passing candidate weights in the isolated ML branch
        if: steps.candidate-gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ml/generated/bleFloodModel.json
          if git diff --cached --quiet; then
            echo "The candidate weights already match the branch; nothing to commit."
            exit 0
          fi
          git commit -m "Embed gate-passing BLE flood candidate weights"
          git push origin HEAD
          echo "Candidate weights were embedded with status=candidate and deployment disabled."
          echo "The app's runtime gate still requires recorded review and a handset smoke test."

      - name: Upload evaluation report, aggregate features and disabled candidate weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueguardian-ble-flood-real-data-candidate
          path: |
            ml_training/reports/ble_flood_evaluation.json
            ml_training/processed/ble_windows.csv
            src/ml/generated/bleFloodModel.json
          if-no-files-found: warn
          retention-days: 30
