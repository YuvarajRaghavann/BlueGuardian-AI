name: Inspect Mendeley BLE Dataset Access

on:
  push:
    branches:
      - 'ml/blueguardian-trained-threat-model-20261016'
    paths:
      - 'ml_training/inspect_mendeley_access.py'
      - '.github/workflows/inspect-mendeley-ble.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueguardian-mendeley-access-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect public landing page and file access route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated ML branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect landing page and documented API routes (no archive download)
        run: python ml_training/inspect_mendeley_access.py

      - name: Upload access diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-ble-access-diagnostics
          path: ml_training/reports/mendeley_access_diagnostics.json
          if-no-files-found: error
          retention-days: 14
