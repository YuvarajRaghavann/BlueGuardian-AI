name: Inspect BLE Research Dataset

on:
  push:
    branches:
      - 'ml/blueguardian-trained-threat-model-20261016'
    paths:
      - '.github/workflows/inspect-mendeley-ble.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueguardian-mendeley-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory public dataset archive (no source data committed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the isolated ML branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download archive and list capture metadata
        run: |
          python ml_training/inspect_mendeley_dataset.py \
            --output ml_training/reports/mendeley_v2_inventory.md

      - name: Upload dataset inventory report
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-ble-v2-inventory
          path: ml_training/reports/mendeley_v2_inventory.md
          if-no-files-found: error
          retention-days: 14
