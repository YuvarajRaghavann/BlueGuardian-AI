name: Feature idea
description: Suggest an improvement to BlueGuardian
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or security considerations
      description: Would it send any new data off the phone, or change what the app trusts?
